name: 'Docker 镜像构建'
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'          # 打 v0.1.0 等标签时自动构建并产出镜像
permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: 'Go 单元测试'
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    - name: '运行测试'
      run: go test ./...
    - name: '静态检查 go vet'
      run: go vet ./...
    - name: '构建 Docker 镜像'
      run: |
        docker build -t mqttbroker .
    - name: '导出并上传镜像工件'
      run: |
        docker save mqttbroker | gzip > mqttbroker-image.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        # 不能用 github.ref_name: Dependabot PR 分支名含 '/' 会使 artifact name 非法导致上传失败
        name: 'mqttbroker-docker-image-${{ github.run_id }}'
        path: 'mqttbroker-image.tar.gz'
        if-no-files-found: 'warn'
        retention-days: 14